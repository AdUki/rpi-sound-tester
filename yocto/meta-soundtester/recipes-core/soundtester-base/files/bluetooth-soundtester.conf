[Unit]
# The pairings must be back in /var/lib/bluetooth, and the radio must have its own address, before
# bluetoothd reads either. Said here, on bluetooth.service, rather than as a WantedBy on the other
# unit: bluetooth.service is started by udev the moment hci0 appears, which can be well before
# multi-user.target, and this way the ordering holds however it is started.
Wants=soundtester-bluetooth.service
After=soundtester-bluetooth.service
