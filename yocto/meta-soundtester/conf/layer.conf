BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "soundtester"
BBFILE_PATTERN_soundtester = "^${LAYERDIR}/"
BBFILE_PRIORITY_soundtester = "10"

# Board-independent: the daemon, the images and the appliance plumbing. What only makes sense on
# top of one BSP layer lives under dynamic-layers/<its collection>/ and is parsed only when that
# layer is in BBLAYERS — which is how one layer serves every board (the Makefile's BOARD picks the
# BSP). The pinned 5.15 kernel, for one, `require`s meta-raspberrypi's linux-raspberrypi.inc.
LAYERDEPENDS_soundtester = "core"
LAYERSERIES_COMPAT_soundtester = "scarthgap"

BBFILES_DYNAMIC += " \
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/recipes-*/*/*.bb \
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/recipes-*/*/*.bbappend \
    meson:${LAYERDIR}/dynamic-layers/meson/recipes-*/*/*.bb \
    meson:${LAYERDIR}/dynamic-layers/meson/recipes-*/*/*.bbappend \
"

# The device-specific settings (hostname, password, Wi-Fi) live here so nobody has to edit
# a recipe to build an image for a different bench. Board settings do not: they are in
# yocto/conf/boards/, pulled in through the build's auto.conf.
require ${LAYERDIR}/conf/soundtester-device.conf
