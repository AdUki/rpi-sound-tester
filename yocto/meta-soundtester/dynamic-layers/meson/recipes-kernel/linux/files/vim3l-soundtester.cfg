# Headless HDMI audio. The image runs no compositor, so fbdev emulation is the only DRM client, and
# its modeset at boot and on hotplug is what puts dw-hdmi into HDMI mode (with audio) rather than
# DVI. The SM1 device tree already reserves a CMA pool large enough for its framebuffer.
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FRAMEBUFFER_CONSOLE=y

# Explicit rather than relied on: it is what connects the TDM output to dw-hdmi.
CONFIG_DRM_DW_HDMI_I2S_AUDIO=y

# USB Audio Class devices on the Type-A ports: extra inputs and outputs on their own clock.
CONFIG_SND_USB_AUDIO=m

# The engine's software clock sleeps to absolute CLOCK_MONOTONIC deadlines.
CONFIG_HIGH_RES_TIMERS=y
