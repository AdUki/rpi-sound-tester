# BOARD=vim3l — Khadas VIM3L (Amlogic S905D3) on meta-meson's khadas-vim3l machine.
#
# Pulled in by the build's conf/auto.conf, which the Makefile writes for the selected BOARD.
# Parse order matters here: bitbake reads soundtester-device.conf first (through the layer's
# layer.conf), then auto.conf and so this file, then local.conf, and the machine conf last. So a
# value this file must own is a hard `=`, and nothing here can override what meta-meson's machine
# includes hard-set (WKS_FILE, IMAGE_BOOT_FILES, IMAGE_NAME_SUFFIX):
#   - WKS_FILE is set at recipe scope in soundtester-image.bb, from SOUNDTESTER_WKS below;
#   - IMAGE_BOOT_FILES already ends up as the fitImage alone (amlogic-modern-boot.inc's `=` comes
#     after khadas-vim3l-dtb.inc's `+=`), which is what the extlinux boot wants;
#   - IMAGE_NAME_SUFFIX is empty there, so the artifacts have no ".rootfs" in their names and the
#     Makefile finds them by pattern.

# Boot (FAT: extlinux.conf + fitImage) + read-only rootfs + the data partition, with the signed
# Amlogic FIP written into the sectors before the first partition by image_types_meson.
SOUNDTESTER_WKS = "soundtester-vim3l.wks"

# The HDMI output's native rate: every HDMI sink and every USB audio class device takes 48 kHz.
SOUNDTESTER_RATE = "48000"
SOUNDTESTER_PERIOD = "1024"

# meta-meson turns these on for the board; a headless bench instrument needs none of them. "screen"
# pulls in the video decoder firmware, and "wifi" a list of Broadcom firmware blobs — which does
# not even include the VIM3L's own AP6398S (BCM4359), so Wi-Fi is Ethernet-only for now whatever
# the device config says.
MACHINE_FEATURES:remove = "screen bluetooth wifi"
