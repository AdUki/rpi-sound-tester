# rpi-sound-tester network input, and its mixer.
#
#   aplay -D soundtester tone.wav                        # defaults below
#   aplay -D soundtester:192.168.1.42 tone.wav           # positional HOST
#   aplay -D soundtester:HOST=bench.local,CHANNEL=1 tone.wav
#   alsamixer -D soundtester                             # volume and mute
#
# The device listens on the base port for any free channel and on base+1+N for NET N+1, so
# PORT=4013 always lands on NET 3. With neither a port nor a channel, a machine is given back
# whichever channel it used last time.
#
# It need not be up: playback starts and keeps time with nothing listening, and the audio joins the
# moment the device answers. One that goes away mid-stream leaves a gap, not an error.
#
# Any of the usual rates and S16/S24/S32/float are accepted; the device converts and resamples.
# CHANNELS asks for that many adjacent inputs — a stereo source becomes NET 1 + NET 2, and the
# pair stays sample-aligned because it travels in one packet through one converter.
#
# MIXER=0 sends a stream the device will not level: alsamixer and the web console are both ignored
# for as long as it plays. For a reference stimulus, which must not be attenuated by a slider
# somebody left at 40%. Give it a device of its own and keep both:
#
#   pcm.soundtester_ref { type soundtester; host "bench.local"; mixer off }
#
# ENCODING=vorbis compresses here and the device decodes, for a link that cannot carry 2.3 MB/s.
# LOSSY: fine for monitoring, wrong for a reference measurement. QUALITY is Vorbis's own VBR
# scale, -0.1 (smallest) to 1.0 (best). `make plugin VORBIS=0` leaves the encoder out entirely.
#
defaults.soundtester.host "soundtester.local"
defaults.soundtester.port 4010
defaults.soundtester.channel -1
defaults.soundtester.channels 1
defaults.soundtester.quality 0.4
defaults.soundtester.mixer 1

# The mixer. One Master — volume and mute together — over every channel this machine is streaming
# on, so a stereo sender is turned down as one source. With no CHANNEL it follows whichever
# channels those are. A stream sent with MIXER=0 shows here as an inactive control.
ctl.soundtester {
	@args [ HOST PORT CHANNEL ]
	@args.HOST {
		type string
		default { @func refer name defaults.soundtester.host }
	}
	@args.PORT {
		type integer
		default { @func refer name defaults.soundtester.port }
	}
	@args.CHANNEL {
		type integer
		default { @func refer name defaults.soundtester.channel }
	}
	type soundtester
	host $HOST
	port $PORT
	channel $CHANNEL
}

pcm.soundtester {
	@args [ HOST PORT CHANNEL CHANNELS ENCODING QUALITY MIXER ]
	@args.HOST {
		type string
		default { @func refer name defaults.soundtester.host }
	}
	@args.PORT {
		type integer
		default { @func refer name defaults.soundtester.port }
	}
	@args.CHANNEL {
		type integer
		default { @func refer name defaults.soundtester.channel }
	}
	@args.CHANNELS {
		type integer
		default { @func refer name defaults.soundtester.channels }
	}
	@args.ENCODING {
		# A literal, NOT a "@func refer" like the others: alsa-lib re-resolves the string a refer
		# returns as a config name, and "pcm" is the root of the PCM namespace — the expander goes
		# back into pcm.soundtester and round again until the stack runs out. It crashes inside
		# alsa-lib with no hint that this file caused it.
		type string
		default "pcm"
	}
	@args.QUALITY {
		type real
		default { @func refer name defaults.soundtester.quality }
	}
	@args.MIXER {
		type integer
		default { @func refer name defaults.soundtester.mixer }
	}
	type soundtester
	host $HOST
	port $PORT
	channel $CHANNEL
	channels $CHANNELS
	encoding $ENCODING
	quality $QUALITY
	mixer $MIXER
	hint {
		show { @func refer name defaults.namehint.basic }
		description "rpi-sound-tester network input"
	}
}
