# A PipeWire sink that plays into an rpi-sound-tester.
# Copy to /etc/pipewire/pipewire.conf.d/51-soundtester.conf; `make plugin-install` first, since
# PipeWire loads the ALSA plugin itself and never sees a build tree.
#
# Either scheduling mode works: the plugin's position follows the monotonic clock, not its poll
# descriptors, so the default timer scheduling drives it as well as `api.alsa.disable-tsched` does.

context.objects = [
    {   factory = adapter
        args = {
            factory.name     = api.alsa.pcm.sink
            node.name        = "soundtester"
            node.description = "rpi-sound-tester"
            media.class      = "Audio/Sink"
            api.alsa.path    = "soundtester:HOST=192.168.1.42,CHANNELS=2"
            audio.format     = "S32LE"
            audio.rate       = 48000
            audio.channels   = 2
            audio.position   = "FL,FR"
        }
    }
]
