# Make an rpi-sound-tester a machine's default output and mixer.
# Copy to /etc/asound.conf or ~/.asoundrc; `make plugin-install` first.
#
# The ADDRESS, not soundtester.local: a daemon that opens these — PipeWire, anything under
# systemd — usually cannot resolve mDNS, and a name that never resolves is silence. The device does
# not have to be up; playback starts anyway and joins when it answers.

# One run of channels per open, pinned apart so two devices cannot take each other's: NET 1+2
# here, NET 3+4 below. Without `channel` a sender gets the run it had last time.
pcm.soundtester_out {
	type soundtester
	host "192.168.1.42"
	port 4010
	channel 0
	channels 2
}

pcm.soundtester_notify {
	type soundtester
	host "192.168.1.42"
	port 4010
	channel 2
	channels 2
}

# No `plug` wrapper: like `hw`, this advertises what the far end really takes, so a mono 8 kHz
# file is refused rather than silently converted. Ask for conversion where you want it:
#   aplay -D 'plug:"soundtester_out"' mono8k.wav
pcm.!default soundtester_out

# One Master — volume and mute — over whatever this machine is streaming. No `channel`: the mixer
# is matched by address, so it follows the audio and widens with it when a stereo stream starts.
ctl.!default {
	type soundtester
	host "192.168.1.42"
	port 4010
}

# Two programs at once want a channel each, as above. `dmix` cannot help: it only slaves to a hw
# device and refuses this one ("Invalid type 'soundtester' for slave PCM"). To mix several
# programs into one channel, put PipeWire in front — see pipewire-51-soundtester.conf.
